<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="轻舟 LiteArk">
  <title>轻舟 LiteArk</title>
  <defs>
    <linearGradient id="la-sail" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#43bead"/>
      <stop offset="0.55" stop-color="#2b9082"/>
      <stop offset="1" stop-color="#1b6559"/>
    </linearGradient>
    <linearGradient id="la-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b6559"/>
      <stop offset="1" stop-color="#123f39"/>
    </linearGradient>
  </defs>

  <!-- 底板：浅色圆角方，深浅背景都能立住 -->
  <rect x="1" y="1" width="254" height="254" rx="56" fill="#fbfdfc" stroke="#1f6b60" stroke-opacity="0.14" stroke-width="2"/>

  <g transform="translate(0,-2)">
    <!-- 桅杆 -->
    <rect x="124" y="40" width="12" height="120" rx="6" fill="#1b6559"/>
    <!-- 主帆（右） -->
    <path d="M136 46 C186 76 204 118 204 158 L136 158 Z" fill="url(#la-sail)"/>
    <!-- 副帆（左） -->
    <path d="M124 78 C94 100 74 128 74 158 L124 158 Z" fill="url(#la-sail)" opacity="0.88"/>
    <!-- 船体 -->
    <path d="M34 156 C70 172 186 172 220 156 L192 194 Q184 204 170 204 H86 Q72 204 64 194 Z" fill="url(#la-hull)"/>
    <!-- 水波 -->
    <path d="M56 226 Q96 238 136 226 T216 226" fill="none" stroke="#2b9082" stroke-opacity="0.55"
          stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
